name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "DESIGN.md"
      - "README.md"
      - ".github/workflows/broken-links.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "DESIGN.md"
      - "README.md"
      - ".github/workflows/broken-links.yml"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --exclude '^https://yannistevissen\.fr/'
            --exclude '^https://fonts\.googleapis\.com/?$'
            --exclude '^https://fonts\.gstatic\.com/?$'
            "dist/**/*.html"
            "DESIGN.md"
            "README.md"
