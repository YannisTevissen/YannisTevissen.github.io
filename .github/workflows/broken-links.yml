name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "DESIGN.md"
      - "README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "DESIGN.md"
      - "README.md"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          args: --verbose --no-progress "dist/**/*.html" "DESIGN.md" "README.md"
