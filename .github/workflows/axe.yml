name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Path under site root (e.g. blog/ or empty for home)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Get Chromium version
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
      - name: Install chromedriver
        run: npm install -g chromedriver@$CHROMIUM_VERSION
      - name: Run axe
        run: |
          npm install -g @axe-core/cli http-server
          http-server dist/ -p 8080 &
          sleep 2
          axe --chromedriver-path $(npm root -g)/chromedriver/bin/chromedriver "http://127.0.0.1:8080/${{ github.event.inputs.url }}" --load-delay=1500 --exit
