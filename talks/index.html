<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0; url=/blog/#press"><meta name="robots" content="noindex"><title>Redirecting to Blog &amp; Press</title><link rel="canonical" href="https://yannistevissen.fr/blog/"><script>
      (() => {
        // Preserve deep links such as /talks/#talks onto the merged page.
        const hash = location.hash;
        const known = new Set(["#press", "#talks", "#notes", "#references"]);
        if (hash && hash !== "#" && known.has(hash)) {
          location.replace(`/blog/${hash}`);
          return;
        }
        location.replace("/blog/#press");
      })();
    </script></head> <body> <p>
Press coverage, interviews, and talks now live on the Blog &amp; Press page.
<a href="/blog/#press">Continue</a>.
</p> </body></html>
